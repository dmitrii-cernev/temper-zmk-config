# Shared user settings, loaded for both temper_left and temper_right.
CONFIG_ZMK_SLEEP=y
# Deep sleep after 10 minutes of inactivity (milliseconds).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Reduce display work to 20 Hz and stop periodic updates after 30 seconds idle.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=50
# Select idle blanking despite the upstream nice!view shield override.
CONFIG_TEMPER_DISPLAY_IDLE_BLANK=y
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Mouse movement, scrolling, and buttons on the Mouse layer.
CONFIG_ZMK_POINTING=y
