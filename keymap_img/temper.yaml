    - '1'
    - '2'
    - '3'
    - '0'
    - '#'
    - {t: '[', s: '{'}
    - {t: ']', s: '}'}
    - ''
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - ⎇
    - Gui+SPACE
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  System:
  - ['', '', '', '', '', '', '', '', '', '']
  - - ''
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - ''
    - ''
    - ''
    - ''
    - ''
    - ''
    - {type: held}
  - - ''
    - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - BT CLR
    - ''
    - ''
    - ''
    - ''
    - ''
  - - {t: ▽, type: trans}
    - ''
    - ''
    - ''
    - {t: ▽, type: trans}
    - ''
  Mouse:
  - - {type: held}
    - ''
    - ''
    - ''
    - ''
    - ''
    - VOL DN
    - VOL UP
    - ''
    - PSCRN
  - ['', '', '', '', '', Mouse ←, Mouse ↓, Mouse ↑, Mouse →, '']
  - ['', '', '', '', '', '', Scroll ↓, Scroll ↑, '', '']
  - - {t: ▽, type: trans}
    - ''
    - ''
    - Mouse 1
    - Mouse 2
    - Mouse 3
